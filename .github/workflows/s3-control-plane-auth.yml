name: S3 Control Plane Auth Gate

on:
  push:
    branches:
      - stabilization/s3-control-plane-auth
  pull_request:
    paths:
      - "src/universal_brain/api/**"
      - "src/universal_brain/config.py"
      - "tests/security/**"
      - "tests/unit/test_api_adversarial.py"
      - ".github/workflows/s3-control-plane-auth.yml"

permissions:
  contents: read

jobs:
  control-plane-auth:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package and test dependencies
        run: python -m pip install -e ".[dev]"

      - name: Compile control-plane modules
        run: >-
          python -m compileall -q
          src/universal_brain/api
          src/universal_brain/kernel
          src/universal_brain/alignment
          src/universal_brain/tools

      - name: Run authenticated control-plane regressions
        run: >-
          python -m pytest -q
          tests/security/test_s3_control_plane_auth.py
          tests/security/test_s1_authority_regression.py
          tests/security/test_s3_authority_enforcement.py
          tests/unit/test_api_adversarial.py
