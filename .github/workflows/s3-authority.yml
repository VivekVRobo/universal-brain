name: S3 Authority Gate

on:
  push:
    branches:
      - stabilization/s3-authority-enforcement
  pull_request:
    paths:
      - "src/universal_brain/kernel/**"
      - "src/universal_brain/alignment/**"
      - "src/universal_brain/tools/**"
      - "tests/security/**"
      - ".github/workflows/s3-authority.yml"

permissions:
  contents: read

jobs:
  authority-security:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package and test dependencies
        run: python -m pip install -e ".[dev]"

      - name: Compile authority modules
        run: python -m compileall -q src/universal_brain/kernel src/universal_brain/alignment src/universal_brain/tools

      - name: Run S1 and S3 authority regressions
        run: >-
          python -m pytest -q
          tests/security/test_s1_authority_regression.py
          tests/security/test_s3_authority_enforcement.py
