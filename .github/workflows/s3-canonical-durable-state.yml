name: S3 Canonical Durable State Gate

on:
  push:
    branches:
      - stabilization/s3-canonical-durable-state
  pull_request:
    paths:
      - "src/universal_brain/kernel/**"
      - "src/universal_brain/api/**"
      - "src/universal_brain/tools/workers/**"
      - "src/universal_brain/autonomy/**"
      - "src/universal_brain/persistence/**"
      - "src/universal_brain/config.py"
      - "tests/security/**"
      - "tests/unit/test_m6_event_store_durability.py"
      - "tests/unit/test_m6_crash_recovery.py"
      - "tests/unit/test_m5_ephemeral_worker_fabric.py"
      - "tests/integration/test_m7_ultimate_master_gate.py"
      - ".github/workflows/s3-canonical-durable-state.yml"

permissions:
  contents: read

jobs:
  canonical-durable-state:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package and test dependencies
        run: python -m pip install -e ".[dev]"

      - name: Compile canonical state modules
        run: >-
          python -m compileall -q
          src/universal_brain/kernel
          src/universal_brain/api
          src/universal_brain/tools/workers
          src/universal_brain/autonomy
          src/universal_brain/persistence

      - name: Run canonical state regressions
        run: >-
          python -m pytest -q
          tests/security/test_s3_canonical_event_journal.py
          tests/security/test_s3_canonical_projections.py
          tests/security/test_s3_sql_projection_reconciliation.py
          tests/security/test_s3_truthful_live_state.py
          tests/security/test_s3_real_isolation_rollback.py
          tests/security/test_s3_control_plane_auth.py
          tests/security/test_s3_authority_enforcement.py
          tests/security/test_s1_authority_regression.py
          tests/unit/test_m6_event_store_durability.py
          tests/unit/test_m6_crash_recovery.py
          tests/unit/test_m5_ephemeral_worker_fabric.py
          tests/integration/test_m7_ultimate_master_gate.py
