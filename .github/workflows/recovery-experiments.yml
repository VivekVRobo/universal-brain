name: Recovery Experiments

on:
  push:
    branches:
      - "research/recovery-experiments-v1"
      - "research/recovery-v2-operation-ledger"
  pull_request:
    paths:
      - "src/universal_brain/engineering/recovery_experiments.py"
      - "src/universal_brain/tools/operation_ledger.py"
      - "src/universal_brain/tools/base.py"
      - "src/universal_brain/tools/gateway.py"
      - "src/universal_brain/kernel/errors.py"
      - "scripts/recovery_experiments.py"
      - "tests/unit/test_recovery_experiments.py"
      - "tests/unit/test_operation_ledger.py"
      - "docs/research/RECOVERY_EXPERIMENT_PROTOCOL_V1.md"
      - "docs/research/RECOVERY_EXPERIMENT_PROTOCOL_V2.md"
      - ".github/workflows/recovery-experiments.yml"
  workflow_dispatch:

jobs:
  recovery-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package and test dependencies
        run: python -m pip install -e ".[dev]"

      - name: Run focused experiment tests
        run: |
          python -m pytest -q tests/unit/test_recovery_experiments.py
          python -m pytest -q tests/unit/test_operation_ledger.py

      - name: Run ToolGateway regression gate
        run: |
          python -m pytest -q tests/security/test_s1_authority_regression.py
          python -m pytest -q tests/integration/test_cellular_monolith.py
          python -m pytest -q tests/unit/test_executive_cognitive.py

      - name: Run one trial smoke campaign
        run: |
          python scripts/recovery_experiments.py run \
            --experiment all \
            --trials 1 \
            --output recovery_experiments_smoke.json

      - name: Run V1 versus V2 publication campaign
        run: |
          python scripts/recovery_experiments.py run --experiment 4 --trials 20 --output experiment_4_v1_baseline.json
          python scripts/recovery_experiments.py run --experiment 5 --trials 20 --output experiment_5_v2.json

      - name: Upload recovery evidence
        uses: actions/upload-artifact@v4
        with:
          name: recovery-v2-publication-evidence
          path: |
            recovery_experiments_smoke.json
            experiment_4_v1_baseline.json
            experiment_5_v2.json
