[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "universal-brain"
version = "0.1.0"
description = "Sovereign, local-first, multi-model executive system preserving human intent"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn>=0.30.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "sqlalchemy>=2.0.30",
    "alembic>=1.13.0",
    "asyncpg>=0.29.0",
    "pgvector>=0.2.5",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "aiosqlite>=0.20.0",
    "hypothesis>=6.103.0",
    "ruff>=0.4.8",
    "mypy>=1.10.0",
]
browser = [
    "playwright>=1.45.0",
]
desktop = [
    "pywinauto>=0.6.8; platform_system == 'Windows'",
]
semantic = [
    "tree-sitter>=0.22.0",
    "tree-sitter-language-pack>=0.7.0",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
