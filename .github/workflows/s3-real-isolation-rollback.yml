name: S3 Real Isolation Rollback Gate

on:
  push:
    branches:
      - stabilization/s3-real-isolation-rollback
  pull_request:
    paths:
      - "src/universal_brain/engineering/**"
      - "src/universal_brain/tools/**"
      - "src/universal_brain/kernel/**"
      - "src/universal_brain/alignment/**"
      - "tests/security/**"
      - "tests/unit/test_engineering_isolation_tool.py"
      - "tests/unit/test_engineering_agency_v52.py"
      - "tests/unit/test_engineering_agency_v53.py"
      - "tests/unit/test_m5_workspace_sandbox.py"
      - "tests/unit/test_m5_command_runner.py"
      - "tests/integration/test_m5_ultimate_master_gate.py"
      - ".github/workflows/s3-real-isolation-rollback.yml"

permissions:
  contents: read

jobs:
  real-isolation-rollback:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package and test dependencies
        run: python -m pip install -e ".[dev]"

      - name: Compile isolation and rollback modules
        run: >-
          python -m compileall -q
          src/universal_brain/engineering
          src/universal_brain/tools
          src/universal_brain/kernel
          src/universal_brain/alignment

      - name: Run isolation and rollback security regressions
        run: >-
          python -m pytest -q
          tests/security/test_s3_real_isolation_rollback.py
          tests/security/test_s3_authority_enforcement.py
          tests/security/test_s1_authority_regression.py
          tests/unit/test_engineering_isolation_tool.py
          tests/unit/test_engineering_agency_v52.py
          tests/unit/test_engineering_agency_v53.py
          tests/unit/test_m5_workspace_sandbox.py
          tests/unit/test_m5_command_runner.py
          tests/integration/test_m5_ultimate_master_gate.py
